#The package.yml file contains the location of models to be loaded from Blender files.
#The name of the objects map to the name of a collection in the blender file.

# The toybox channel ships against a single public-share volume registered
# under the `example` logical name. Every objects: entry below references
# it via `example:<path>`. See the volume's NOTICE.md and LICENSES for the
# per-asset attribution and licence roster (CC0-1.0 for Rendered.ai-
# authored assets, MIT for Rocketbox, CC0-1.0 for Poly Haven HDRIs).
volumes:
  example: 708b0ca9-d81c-4679-b164-141418507830
# Define objects.
objects:

  YoYo:
    filename: example:Toys/YoYo_greenLogo.blend

  BubbleBottle:
    filename: example:Toys/BubbleBottle_greenLogo.blend

  Skateboard:
    filename: example:Toys/Skateboard_v2.blend

  Cube:
    filename: example:Toys/Cube.blend

  Mix Cube:
    filename: example:Toys/MixCube.blend

  PlayDough:
    filename: example:Toys/PlayDough_greenLogo.blend

  Light Wooden Box:
    filename: example:Containers/LightWoodenBox.blend

  Dark Wooden Box:
    filename: example:Containers/DarkWoodenBox.blend

  Blue Tub:
    filename: example:Containers/BlueTub.blend

  Orange Tub:
    filename: example:Containers/OrangeTub.blend

  Green Tub:
    filename: example:Containers/GreenTub.blend

  Clear Tub:
    filename: example:Containers/ClearTub.blend

  Gray Tub:
    filename: example:Containers/GrayTub.blend

  Yellow Bowl:
    filename: example:Containers/YellowBowl.blend

  Purple Bowl:
    filename: example:Containers/PurpleBowl.blend

  Short Basket:
    filename: example:Containers/ShortBasket.blend

  Tall Basket:
    filename: example:Containers/TallBasket.blend

  Plane Floor:
    filename: example:Floors/PlaneFloor.blend

  Tile:
    filename: example:Floors/Tile.blend

  Cobbles:
    filename: example:Floors/Cobble.blend

  Wood:
    filename: example:Floors/Wood.blend

  Hardwood:
    filename: example:Floors/Wood03.blend

  Rocks:
    filename: example:Floors/Rock.blend

  Granite:
    filename: example:Floors/Granite.blend

  Metal:
    filename: example:Floors/Metal.blend

  # Fruit props (single objects). Baskets migrated to Containers/ above.
  Apple:
    filename: example:Fruit/Apple.blend

  Orange:
    filename: example:Fruit/Orange.blend

  # Full-scene blends consumed by the BlendFileScene aggregator.
  Parking Lot Scene:
    filename: example:Outdoor/ParkingLot.blend