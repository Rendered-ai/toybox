schemas:
  ManualPlacementClass:
    alias: Manual Placement
    help: toybox/ManualPlacement.md
    inputs:
    - name: Object Generators
      description: >-
        One or more upstream object generators (Yo-yo, Character, etc.).
        Exactly one object will be spawned; when multiple generators are
        wired the node picks one for you. For multi-object hand-composed
        scenes, drop one Manual Placement node per object.
      validation:
        oneOf:
          - numLinks: oneOrMany
          - type: string
            minLength: 0
            maxLength: 0
    - name: Location (m)
      default: "[0, 0, 0]"
      description: >-
        World-space XYZ position in meters. Type directly as
        "[x, y, z]" or wire a Vector3D node.
      validation:
        oneOf:
          - numLinks: one
          - type: string
            pattern: '^\s*\[[^\]]*\]\s*$'
    - name: Rotation (deg)
      default: "[0, 0, 0]"
      description: >-
        Euler XYZ rotation in degrees (Blender's default XYZ order).
        Type directly as "[rx, ry, rz]" or wire a Vector3D node.
      validation:
        oneOf:
          - numLinks: one
          - type: string
            pattern: '^\s*\[[^\]]*\]\s*$'
    outputs:
    - name: Object Generator
      description: >-
        The single placed object, in a list so it slots into the Scene
        aggregator's Placed Objects port alongside the other placement
        nodes.
    tooltip: >-
      Spawn one object at the exact Location and Rotation given.
      Fully deterministic -- the only non-random placement node in the
      channel. Chain several to compose scenes by hand.
    category: Scenes
    subcategory: Placement
    color: "#B3B324"
