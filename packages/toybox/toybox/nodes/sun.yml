schemas:
  SunNode:
    alias: Sun
    help: toybox/Sun.md
    inputs:
    - name: Elevation (deg)
      default: 45.0
      description: >-
        Sun angle above the horizon. 0 = horizon, 90 = straight overhead.
        Negative values place the sun below the horizon (useful for
        moonlight / twilight sims with very low strength).
      validation:
        oneOf:
        - numLinks: one
        - type: number
          minimum: -90.0
          maximum: 90.0
    - name: Azimuth (deg)
      default: 180.0
      description: >-
        Compass direction the sun shines from. 0 = N, 90 = E, 180 = S,
        270 = W. The shadow it casts on the ground points away from this
        compass direction.
      validation:
        oneOf:
        - numLinks: one
        - type: number
          minimum: 0.0
          maximum: 360.0
    - name: Strength (W/m^2)
      default: 3.0
      description: >-
        Irradiance at the surface. Sensible range: ~3 = clear midday sun;
        ~0.5 = overcast; ~10 = strong tropical noon; ~0.1 = full moon.
      validation:
        oneOf:
        - numLinks: one
        - type: number
          minimum: 0.0
          maximum: 50.0
    - name: Color
      default: "[1.0, 1.0, 1.0]"
      description: >-
        RGB tint, 0-1 per channel. Default white = neutral daylight.
        Warm yellows / oranges for sunrise & sunset, cool blues for
        overcast / blue hour. Wire Random Uniform x3 -> Vector3D for full
        randomisation, or Random Choice between String palettes for
        curated time-of-day variation.
      validation:
        oneOf:
        - numLinks: one
        - type: string
          pattern: '^\s*\[[^\]]*\]\s*$'
    - name: Angular Size (deg)
      default: 0.53
      description: >-
        Angular diameter of the sun disc. The real sun is ~0.53 deg ->
        crisp shadows. Raise to ~5-20 for soft, overcast-style penumbras.
        The single biggest knob for "looks like noon" vs "looks cloudy".
      validation:
        oneOf:
        - numLinks: one
        - type: number
          minimum: 0.1
          maximum: 45.0
    outputs:
    - name: Light
    tooltip: >-
      Directional sunlight from infinity. Controlled by Elevation +
      Azimuth (sky coordinates) rather than Location, because the rays
      are parallel and the lamp position is meaningless.
    category: Scenes
    subcategory: Lights
    color: "#B3B324"
