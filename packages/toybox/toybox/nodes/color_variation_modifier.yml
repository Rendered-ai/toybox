schemas:
  ColorVariationModifier:
    alias: Color Variation
    help: toybox/ColorVariationModifier.md
    inputs:
    - name: Color
      description:
      select:
        - <random>
        - Red
        - Orange
        - Yellow
        - Green
        - Blue
        - Indigo
        - Violet
        - White
        - Black
      default: <random>
      validation:
        type: string
    - name: Generators
      description: Object generator
      validation:
        numLinks: oneOrMany
    outputs:
    - name: Object Generator
      description: Colour-varied object generator. Wire into any Object Generators port the same way as a raw generator.
    - name: Generator
      description: Legacy alias for Object Generator; kept so graphs authored before the 2026-05 port-name unification (commit e3082df) still load. Prefer Object Generator on new graphs. Both ports emit the same value.
    tooltip: Change the color variation between objects
    category: Objects
    subcategory: Object Modifiers
    color: "#2472B3"