schemas:
  ToyNode:
    alias: Toy
    help: toybox/ToyNode.md
    inputs:
    - name: Toy Type
      description: Which toy the node spawns. `<random>` picks one uniformly at run time. New toys are added by extending `_TOY_REGISTRY` in `object_generators.py` and appending to this `select:` list.
      select:
        - <random>
        - Bubbles
        - Yo-yo
        - Skateboard
        - Playdough
        - Rubik's Cube
        - Mix Cube
      default: <random>
      validation:
        type: string
    outputs:
    - name: Object Generator
      description: Toy generator. Wire into any Object Generators port (Spatial Cluster, Random Placement, Manual Placement, ...) or into a Color Variation / Scale / Warp modifier.
    tooltip: Toy factory (Bubbles, Yo-yo, Skateboard, Playdough, Rubik's Cube, Mix Cube)
    category: Objects
    subcategory: Basic Objects
    color: "#2472B3"

  FruitNode:
    alias: Fruit
    help: toybox/FruitNode.md
    inputs:
    - name: Fruit Type
      description: Which fruit prop the node spawns. `<random>` picks one uniformly at run time. New fruit are added by extending `_FRUIT_REGISTRY` in `object_generators.py` and appending to this `select:` list.
      select:
        - <random>
        - Apple
        - Orange
      default: <random>
      validation:
        type: string
    outputs:
    - name: Object Generator
      description: Fruit generator. Wire into any Object Generators port (Spatial Cluster, Random Placement, Manual Placement, ...) or into a Color Variation / Scale / Warp modifier.
    tooltip: Fruit factory (Apple, Orange)
    category: Objects
    subcategory: Basic Objects
    color: "#2472B3"

  ContainerNode:
    alias: Container
    help: toybox/ContainerNode.md
    inputs:
    - name: Container Type
      description: Type of container into which the objects are dropped
      select:
        - <random>
        - Dark Wooden Box
        - Light Wooden Box
        - Clear Tub
        - Orange Tub
        - Green Tub
        - Blue Tub
        - Gray Tub
        - Yellow Bowl
        - Purple Bowl
        - Short Basket
        - Tall Basket
      default: <random>
      validation:
        type: string
    outputs:
    - name: Object Generator
      description: Container generator. Wire into a Procedural Scene's Container Generator input (or any Object Generators port if you want to treat it as a generic placed object).
    - name: Container Generator
      description: Legacy alias for Object Generator; kept so graphs authored before the 2026-05 port-name unification (commit e3082df) still load. Prefer Object Generator on new graphs. Both ports emit the same value.
    tooltip: Container factory
    category: Objects
    subcategory: Scene Props
    color: "#2472B3"

  FloorNode:
    alias: Floor
    help: toybox/FloorNode.md
    inputs:
    - name: Floor Type
      description: Type of floor the container sits on
      select:
        - <random>
        - Plane Floor
        - Tile
        #- Wood
        - Hardwood
        - Granite
        - Metal
        - Rocks
        - Cobbles
      default: <random>
      validation:
        type: string
    outputs:
    - name: Object Generator
      description: Floor generator. Wire into a Procedural Scene's Floor Generator input (or any Object Generators port if you want to treat it as a generic placed object).
    - name: Floor Generator
      description: Legacy alias for Object Generator; kept so graphs authored before the 2026-05 port-name unification (commit e3082df) still load. Prefer Object Generator on new graphs. Both ports emit the same value.
    tooltip: Floor factory
    category: Objects
    subcategory: Scene Props
    color: "#2472B3"
